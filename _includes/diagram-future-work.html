<div class="w-full max-w-4xl mx-auto my-8" style="font-family: 'Inter', system-ui, sans-serif;">
  <svg viewBox="0 0 720 520" class="w-full" preserveAspectRatio="xMidYMid meet" aria-label="Future work roadmap">

    {%- comment -%} Central NWAP node {%- endcomment -%}
    <circle cx="360" cy="260" r="60" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>
    <text x="360" y="252" text-anchor="middle" font-size="14" font-weight="700" fill="#7c2d12">NWAP</text>
    <text x="360" y="270" text-anchor="middle" font-size="10" fill="#7c2d12">four-paper baseline</text>
    <text x="360" y="284" text-anchor="middle" font-size="10" fill="#7c2d12">established</text>

    {%- comment -%} Four roadmap branches as quadrants. {%- endcomment -%}

    {%- comment -%} I — Discrimination (top-left) {%- endcomment -%}
    <g>
      <line x1="320" y1="220" x2="180" y2="100" stroke="#dc2626" stroke-width="1.6" stroke-dasharray="4,3"/>
      <rect x="20" y="40" width="240" height="120" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
      <text x="140" y="68" text-anchor="middle" font-size="13" font-weight="700" fill="#7f1d1d">I. Discrimination</text>
      <text x="140" y="88" text-anchor="middle" font-size="10" fill="#7f1d1d">free-energy / dissipative</text>
      <text x="140" y="102" text-anchor="middle" font-size="10" fill="#7f1d1d">/ constructal vs NWAP</text>
      <text x="140" y="122" text-anchor="middle" font-size="10" font-style="italic" fill="#7f1d1d">intervention experiments</text>
      <text x="140" y="138" text-anchor="middle" font-size="10" font-style="italic" fill="#7f1d1d">+ targeted predictions</text>
    </g>

    {%- comment -%} II — Scale-up (top-right) {%- endcomment -%}
    <g>
      <line x1="400" y1="220" x2="540" y2="100" stroke="#1d4ed8" stroke-width="1.6" stroke-dasharray="4,3"/>
      <rect x="460" y="40" width="240" height="120" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
      <text x="580" y="68" text-anchor="middle" font-size="13" font-weight="700" fill="#1e3a8a">II. Scale-up</text>
      <text x="580" y="86" text-anchor="middle" font-size="10" fill="#1e3a8a">physiology in vivo</text>
      <text x="580" y="100" text-anchor="middle" font-size="10" fill="#1e3a8a">physics → EM, fluid, QM</text>
      <text x="580" y="114" text-anchor="middle" font-size="10" fill="#1e3a8a">NAS → 1B+ params</text>
      <text x="580" y="128" text-anchor="middle" font-size="10" fill="#1e3a8a">biology → n=30–50</text>
      <text x="580" y="148" text-anchor="middle" font-size="10" font-style="italic" fill="#1e3a8a">cross-ecosystem replication</text>
    </g>

    {%- comment -%} III — Meaning (bottom-left) {%- endcomment -%}
    <g>
      <line x1="320" y1="300" x2="180" y2="420" stroke="#7c3aed" stroke-width="1.6" stroke-dasharray="4,3"/>
      <rect x="20" y="360" width="240" height="120" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
      <text x="140" y="388" text-anchor="middle" font-size="13" font-weight="700" fill="#4c1d95">III. The "meaning" question</text>
      <text x="140" y="408" text-anchor="middle" font-size="10" fill="#4c1d95">is meaning a measurable,</text>
      <text x="140" y="422" text-anchor="middle" font-size="10" fill="#4c1d95">framework-invariant quantity?</text>
      <text x="140" y="442" text-anchor="middle" font-size="10" font-style="italic" fill="#4c1d95">cross-domain dataset crossover</text>
      <text x="140" y="458" text-anchor="middle" font-size="10" font-style="italic" fill="#4c1d95">+ synthetic-system construction</text>
    </g>

    {%- comment -%} IV — Engineering applications (bottom-right) {%- endcomment -%}
    <g>
      <line x1="400" y1="300" x2="540" y2="420" stroke="#047857" stroke-width="1.6" stroke-dasharray="4,3"/>
      <rect x="460" y="360" width="240" height="120" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="1.5"/>
      <text x="580" y="388" text-anchor="middle" font-size="13" font-weight="700" fill="#064e3b">IV. Engineering applications</text>
      <text x="580" y="408" text-anchor="middle" font-size="10" fill="#064e3b">energy-first NAS for edge,</text>
      <text x="580" y="422" text-anchor="middle" font-size="10" fill="#064e3b">implantable / wearable AI</text>
      <text x="580" y="438" text-anchor="middle" font-size="10" fill="#064e3b">dysbiosis as ΔQ-loss signature</text>
      <text x="580" y="458" text-anchor="middle" font-size="10" font-style="italic" fill="#064e3b">action-functional symbolic regression</text>
    </g>

    {%- comment -%} Caption {%- endcomment -%}
    <text x="360" y="510" text-anchor="middle" font-size="11" fill="#475569">
      The four branches the framework opens after the 2026 four-paper baseline
    </text>
  </svg>
</div>
